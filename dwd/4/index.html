<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DarkWebDark/4</title>
<link rel="stylesheet" href="../../assets/dark.css">
<style>
  .hall { display: flex; justify-content: center; gap: clamp(10px, 4vw, 28px); margin: 26px 0 12px; perspective: 600px; }
  .d {
    width: clamp(78px, 24vw, 140px); aspect-ratio: 2 / 3.6; position: relative; cursor: pointer; border: 0; padding: 0;
    background: linear-gradient(90deg, #1b120f, #261914 50%, #1b120f); box-shadow: inset 0 0 0 3px #0c0807, 0 0 0 1px #2b1d18;
    transform-origin: left center; transition: transform .7s ease, box-shadow .2s; touch-action: manipulation;
  }
  .d::before { content: ""; position: absolute; inset: 12% 14% 50% 14%; border: 2px solid #0e0907; }
  .d::after { content: ""; position: absolute; right: 12%; top: 54%; width: 9px; height: 9px; border-radius: 50%; background: #6a563f; }
  .d.listened { box-shadow: inset 0 0 0 3px #0c0807, 0 0 0 1px #8a1a1a, 0 0 18px #6a000055; }
  .d.opening { transform: rotateY(-75deg); }
  .d .lbl { position: absolute; left: 0; right: 0; bottom: -30px; text-align: center; font-size: 13px; color: #6d6058; letter-spacing: .15em; }
  .d:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }
  .depth { font-family: "Courier New", monospace; text-align: center; color: #6b1010; letter-spacing: .3em; }
  .rule { text-align: center; font-size: 14px; color: #6e655e; line-height: 1.9; }
  .ear { position: absolute; top: -26px; left: 0; right: 0; text-align: center; font-size: 13px; color: #c33; letter-spacing: .1em; }
</style>
</head>
<body>
<div class="vignette"></div>
<div class="page">
  <div class="layer">LAYER 04 / ろうか</div>
  <h1 class="logo">DarkWebDark/4</h1>
  <p class="msg">おとが　しない　とびらだけ　あけて</p>
  <p class="rule">1かい　さわると　みみを　すます<br>2かい　さわると　あける</p>
  <p class="depth" id="depth">B4 - 1 / 3</p>
  <div class="hall" id="hall"></div>
  <p class="err" id="err" style="margin-top:40px"></p>
</div>
<div class="footer-ver" data-dwd-ver></div>

<script src="../../assets/dwd.js"></script>
<script>
(function () {
  'use strict';
  DWD.noiseBg(0.05);
  var hall = document.getElementById('hall');
  var err = document.getElementById('err');
  var round = 0;
  var fails = 0;
  var busy = false;
  var SOUNDS = ['knock', 'scratch', 'breath', 'whisper', 'heartbeat'];
  var LABEL = { knock: 'コン　コン', scratch: 'ガリ…ガリ…', breath: 'はぁ……', whisper: '……ささやき', heartbeat: 'ドクン' };

  function build() {
    hall.innerHTML = '';
    document.getElementById('depth').textContent = 'B4 - ' + (round + 1) + ' / 3';
    var safe = Math.floor(Math.random() * 3);
    var pool = SOUNDS.slice().sort(function () { return Math.random() - 0.5; });
    for (var i = 0; i < 3; i++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'd';
      b.setAttribute('aria-label', 'とびら' + (i + 1));
      b.dataset.snd = i === safe ? '' : pool[i];
      b.innerHTML = '<span class="ear"></span><span class="lbl">' + ['ひだり', 'まんなか', 'みぎ'][i] + '</span>';
      hall.appendChild(b);
    }
  }

  hall.addEventListener('click', function (e) {
    var d = e.target.closest('.d');
    if (!d || busy || DWD.isScaring()) return;
    var snd = d.dataset.snd;
    if (!d.classList.contains('listened')) {
      // 1回目：みみを すます
      DWD.$$('.d', hall).forEach(function (x) { x.classList.remove('listened'); x.querySelector('.ear').textContent = ''; });
      d.classList.add('listened');
      var ear = d.querySelector('.ear');
      if (snd) {
        if (snd === 'heartbeat') DWD.sfx.heartbeat(2, 0.6);
        else if (snd === 'knock') DWD.sfx.knock(2);
        else DWD.sfx[snd]();
        ear.textContent = LABEL[snd];
      } else {
        ear.textContent = '……';
      }
      return;
    }
    // 2回目：あける
    busy = true;
    d.classList.add('opening');
    DWD.sfx.static(0.2, 0.15);
    if (!snd) {
      setTimeout(function () {
        round++;
        if (round >= 3) {
          err.textContent = 'ぬけた';
          DWD.set('layer', Math.max(DWD.get('layer') || 0, 5));
          DWD.go('../5/index.html', 1300);
          return;
        }
        err.textContent = DWD.pick(['しずかだった', 'まだ　つづく', 'もっと　おく']);
        DWD.sfx.boom(0.4);
        build();
        busy = false;
      }, 800);
    } else {
      fails++;
      DWD.inc('miss');
      setTimeout(function () {
        DWD.scare({ type: DWD.pick(['face', 'face', 'eye']), dur: 1200 }).then(function () {
          round = 0;
          err.textContent = fails >= 3 ? 'ヒント：みみを　すまして　なにも　きこえない　とびら' : 'さいしょから';
          build();
          busy = false;
        });
      }, 450);
    }
  });

  build();
  DWD.gate({ title: 'LAYER 04 に　おりますか', button: 'おりる', warn: '※ 音が手がかりになります' }).then(function () {
    DWD.drone(0.12);
    DWD.haunt({ min: 15000, max: 28000, big: false, silent: true, paused: function () { return busy; } });
  });
})();
</script>
</body>
</html>
