<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひだまり日記</title>
<meta name="description" content="ゆきのゆるっと日常ブログ。猫とカフェとひとり暮らし。">
<link rel="stylesheet" href="assets/blog.css">
</head>
<body>
<header class="site-header">
  <h1 class="site-title"><a href="index.html"><span class="sun"></span><span id="siteName">ひだまり日記</span></a></h1>
  <p class="site-desc" id="siteDesc">ゆきのゆるっと日常ブログ ／ 猫とカフェとひとり暮らし</p>
</header>
<nav class="nav">
  <a href="index.html">ホーム</a>
  <a href="#profile">プロフィール</a>
  <a href="#archive">アーカイブ</a>
</nav>

<div class="wrap">
  <main id="posts"></main>

  <aside class="side">
    <div class="card profile" id="profile">
      <h3>プロフィール</h3>
      <div class="avatar" id="avatar"><div class="hair"></div><div class="face"></div><div class="eye l"></div><div class="eye r"></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div></div>
      <b>ゆき</b>
      <p class="small" id="profText">社会人2年目。最近ひとり暮らしをはじめました。黒猫のクロと暮らしてます🐈‍⬛ カフェ巡りが好き！</p>
    </div>
    <div class="card">
      <h3>アクセスカウンター</h3>
      <div style="text-align:center"><span class="counter" id="counter">001203</span>
      <p class="small" id="counterNote" style="margin:6px 0 0">いつも見てくれてありがとう♪</p></div>
    </div>
    <div class="card" id="archive">
      <h3>アーカイブ</h3>
      <ul id="archiveList">
        <li><a href="blog/1.html">2026年9月 (2)</a></li>
        <li><a href="blog/3.html">2026年9月 (1)</a></li>
        <li><a href="blog/4.html">2026年10月 (2)</a></li>
      </ul>
    </div>
    <div class="card">
      <h3>お気に入りリンク</h3>
      <ul id="links">
        <li><a href="javascript:void(0)" class="dead">喫茶こもれび</a></li>
        <li><a href="javascript:void(0)" class="dead">ねこのいる暮らし</a></li>
        <li><a href="javascript:void(0)" class="dead">ひとり暮らしレシピ帖</a></li>
      </ul>
    </div>
  </aside>
</div>

<footer class="site-footer">
  © 2026 ひだまり日記
  <div data-dwd-ver="ひだまり日記"></div>
</footer>

<script src="assets/dwd.js"></script>
<script src="assets/blog.js"></script>
<script>
(function () {
  'use strict';
  var read = DWD.get('read') || 0;
  var escaped = DWD.get('escaped');
  var cleared = DWD.get('cleared');

  var POSTS = [
    { n: 5, date: '2026/10/31', title: '（無題）', ex: '　', tags: ['日記'] },
    { n: 4, date: '2026/10/14', title: 'クロがいなくなりました', ex: '3日前から、クロが帰ってきません。見かけた方はコメントで教えてください。', tags: ['クロ', 'おねがい'] },
    { n: 3, date: '2026/09/27', title: '夜の音', ex: '最近、夜中にとなりの部屋から音がします。となりって空き部屋のはずなんだけど…。', tags: ['ひとり暮らし'] },
    { n: 2, date: '2026/09/12', title: '近所のカフェを開拓☕', ex: '駅前の「喫茶こもれび」に行ってきました！ ラテアートがかわいすぎる…！', tags: ['カフェ'] },
    { n: 1, date: '2026/09/03', title: 'はじめまして！', ex: 'ブログはじめました！ 引っ越したばかりの古いアパートでのんびり暮らしてます。', tags: ['おしらせ'] }
  ];

  var main = document.getElementById('posts');

  /* -------- RTAモード＋オンラインランキング（1回クリアで解放） -------- */
  function rtaCard() {
    var box = document.createElement('section');
    box.className = 'card rta-card';
    box.id = 'rank';
    var best = DWD.get('rtaBest');
    var pending = DWD.get('rtaPending');
    box.innerHTML =
      '<h3 class="rta-h">RTAモード</h3>' +
      '<p class="small" style="margin:0 0 10px">ブログ1記事目から脱出まで、どれだけ速くクリアできるか。タイマーは「RTA開始」を押した瞬間から、最深部の「そとへ」を押すまで計測されます。</p>' +
      '<div class="rta-row"><button type="button" class="rta-btn" id="rtaStart">RTA開始</button>' +
      '<span class="small">自己ベスト <b class="rta-num" id="rtaBest">' + (best ? DWD.fmt(best) : '--:--.--') + '</b></span></div>' +
      '<form id="rtaForm" class="rta-form" hidden>' +
      '<p style="margin:0 0 6px">登録できるタイム：<b class="rta-num" id="rtaPend"></b></p>' +
      '<div class="comment-form" style="margin:0"><input id="rtaName" maxlength="12" placeholder="ランキングに出す名前" autocomplete="nickname"><button id="rtaSend">登録</button></div>' +
      '</form>' +
      '<p class="small" id="rtaMsg" style="margin:8px 0 0;min-height:1.4em"></p>' +
      '<h3 class="rta-h" style="margin-top:14px">オンラインランキング</h3>' +
      '<ol class="rta-list" id="rtaList"><li class="small">読み込み中…</li></ol>';
    main.insertBefore(box, main.firstChild);

    document.getElementById('rtaStart').addEventListener('click', function () {
      DWD.rtaStart();
      location.href = 'index.html';
    });
    if (pending) {
      document.getElementById('rtaForm').hidden = false;
      document.getElementById('rtaPend').textContent = DWD.fmt(pending);
      document.getElementById('rtaName').value = (DWD.get('name') || '').slice(0, 12);
    }
    if (location.hash === '#rank') setTimeout(function () { box.scrollIntoView({ block: 'start' }); }, 50);
    initRanking();
  }

  function initRanking() {
    var list = document.getElementById('rtaList');
    var msg = document.getElementById('rtaMsg');
    var form = document.getElementById('rtaForm');
    function offline(text) {
      list.innerHTML = '';
      var li = document.createElement('li');
      li.className = 'small';
      li.textContent = text;
      list.appendChild(li);
      if (!form.hidden) {
        document.getElementById('rtaSend').disabled = true;
      }
    }
    // claude.ai の公開ページ上でだけ使える共有データベースを使う
    var tries = 0;
    (function waitClaude() {
      if (window.claude && typeof window.claude.use === 'function') return connect();
      if (++tries > 30) return offline('オンラインランキングは、claude.ai の公開ページで開いたときだけ使えます。');
      setTimeout(waitClaude, 100);
    })();

    function connect() {
      Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
        var db = r[0], user = r[1];
        if (!db) return offline('ランキングを読み込めませんでした（claude.ai にサインインすると表示されます）。');
        return (user ? user.id() : Promise.resolve(null)).then(function (uid) {
          var loading = setTimeout(function () {
            if (list.querySelector('li.small')) offline('ランキングにまだ接続できません。しばらくしてから開き直してください。');
          }, 10000);
          db.collection('rta').orderBy('ms').limit(50).onSnapshot(function (snap) {
            if (!snap.metadata.fromCache) clearTimeout(loading);
            list.innerHTML = '';
            var rank = 0;
            snap.docs.forEach(function (d) {
              var v = d.data() || {};
              if (typeof v.ms !== 'number' || typeof v.name !== 'string') return;
              rank++;
              var li = document.createElement('li');
              if (uid && d.id === uid) li.className = 'me';
              var n = document.createElement('span');
              n.className = 'rta-rank';
              n.textContent = rank + '位';
              var nm = document.createElement('span');
              nm.className = 'rta-who';
              nm.textContent = v.name.slice(0, 12) + (uid && d.id === uid ? '（あなた）' : '');
              var t = document.createElement('b');
              t.className = 'rta-num';
              t.textContent = DWD.fmt(v.ms);
              li.appendChild(n); li.appendChild(nm); li.appendChild(t);
              list.appendChild(li);
            });
            if (!rank) offline('まだ記録がありません。最初の記録を残そう。');
          }, function () {
            clearTimeout(loading);
            offline('ランキングを読み込めませんでした。');
          });

          if (!uid) {
            document.getElementById('rtaSend').disabled = true;
            if (!form.hidden) msg.textContent = 'ランキングに登録するには claude.ai へのサインインが必要です。';
            return;
          }
          var sending = false;
          form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (sending) return;
            var ms = DWD.get('rtaPending');
            var name = document.getElementById('rtaName').value.trim().slice(0, 12);
            if (!name) { msg.textContent = '名前を入れてください。'; return; }
            if (typeof ms !== 'number' || ms < 30000 || ms > 3 * 3600000) { msg.textContent = 'このタイムは登録できません。'; return; }
            sending = true;
            msg.textContent = '登録中…';
            var ref = db.doc('rta/' + uid);
            ref.get().then(function (cur) {
              var old = cur.exists ? cur.data() : null;
              if (old && typeof old.ms === 'number' && old.ms <= ms) {
                msg.textContent = '登録済みのタイム（' + DWD.fmt(old.ms) + '）の方が速いので、そのままにしました。';
                return;
              }
              return ref.set({ name: name, ms: ms, at: new Date().toISOString(), ver: DWD.VERSION }).then(function () {
                msg.textContent = '登録しました！';
              });
            }).then(function () {
              DWD.set('rtaPending', null);
              form.hidden = true;
            }).catch(function (err) {
              msg.textContent = err && err.code === 'invalid_argument'
                ? 'この共有設定では登録できません（閲覧のみの権限です）。'
                : '登録できませんでした。時間をおいてもう一度試してください。';
            }).then(function () { sending = false; });
          });
        });
      }).catch(function () {
        offline('ランキングを読み込めませんでした。');
      });
    }
  }

  function render(list) {
    main.innerHTML = '';
    list.forEach(function (p) {
      var a = document.createElement('article');
      a.className = 'card';
      a.innerHTML =
        '<div class="post-date"></div><h2 class="post-title"><a></a></h2>' +
        '<p class="post-excerpt"></p><div class="tags"></div><a class="readmore">続きを読む →</a>';
      a.querySelector('.post-date').textContent = p.date;
      var t = a.querySelector('.post-title a');
      t.textContent = p.title;
      t.href = p.href || 'blog/' + p.n + '.html';
      a.querySelector('.readmore').href = t.href;
      a.querySelector('.post-excerpt').textContent = p.ex;
      p.tags.forEach(function (tg) {
        var s = document.createElement('span');
        s.className = 'tag';
        s.textContent = '#' + tg;
        a.querySelector('.tags').appendChild(s);
      });
      main.appendChild(a);
    });
  }

  // お気に入りリンクは開かない（リンク切れ）
  DWD.$$('.dead').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      a.textContent = 'このページは存在しません';
    });
  });

  /* -------- 1周クリア後 -------- */
  if (cleared) {
    document.body.classList.add('blood');
    document.getElementById('avatar').classList.add('creepy');
    document.getElementById('siteName').textContent = 'ひだまり日記';
    document.getElementById('siteDesc').textContent = 'あなたも　ここで　くらしませんか';
    document.getElementById('counter').textContent = '000002';
    document.getElementById('counterNote').textContent = 'ゆき と ' + (DWD.get('name') || 'あなた');
    render(POSTS.map(function (p) {
      return { n: p.n, date: p.date, title: 'みつけた', ex: 'みつけた　みつけた　みつけた', tags: ['203'], href: 'end.html' };
    }));
    var box = document.createElement('div');
    box.className = 'card';
    box.innerHTML = '<p>もう一度、はじめから遊びますか？（セーブデータが消えます）</p><button type="button" id="resetBtn" style="font:inherit;padding:10px 20px;border-radius:10px;border:0;background:#a00;color:#fff;cursor:pointer">さいしょから</button>';
    main.insertBefore(box, main.firstChild);
    document.getElementById('resetBtn').addEventListener('click', function () {
      DWD.reset();
      location.href = 'index.html';
    });
    rtaCard();
    return;
  }

  /* -------- 脱出後（エンディング演出） -------- */
  if (escaped) {
    render([{ n: 6, date: '2026/11/02', title: 'ただいま！ クロも帰ってきました🐈‍⬛', ex: 'ずっと更新できなくてごめんなさい！ もう大丈夫です。全部、夢だったみたい。', tags: ['おしらせ', 'クロ'], href: '#' }].concat(POSTS.slice(1)));
    document.getElementById('counterNote').textContent = 'おかえりなさい♪';
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = '🎉 <b>脱出成功！</b> 表の世界に戻ってきました。<br><span class="small">おつかれさまでした。</span>';
    document.body.appendChild(toast);
    setTimeout(function () { DWD.sfx.chime(); }, 300);

    var started = false;
    function finale() {
      if (started) return;
      started = true;
      toast.remove();
      var name = DWD.get('name') || 'あなた';
      var titles = DWD.$$('.post-title a, .post-excerpt, .site-desc, #siteName, .small, .tag, .readmore, .side li a, .side h3');
      var hb = 0;
      // 心音がだんだん早くなる
      DWD.sfx.heartbeat(4, 0.85);
      setTimeout(function () { document.getElementById('avatar').classList.add('creepy'); DWD.sfx.blip(); }, 1400);
      setTimeout(function () { document.body.classList.add('stage-5'); DWD.sfx.whisper(2); }, 2400);
      setTimeout(function () {
        DWD.sfx.heartbeat(6, 0.45);
        var iv = setInterval(function () {
          hb++;
          titles.forEach(function (el) {
            el.textContent = DWD.corrupt(el.getAttribute('data-o') || (el.setAttribute('data-o', el.textContent), el.textContent), Math.min(1, hb * 0.12));
          });
          if (hb % 3 === 0) DWD.sfx.blip();
          if (hb > 9) {
            clearInterval(iv);
            document.body.classList.add('blood');
            document.body.classList.remove('stage-5');
            DWD.$$('.post-title a').forEach(function (el) { el.textContent = 'みつけた'; });
            DWD.$$('.post-excerpt').forEach(function (el) { el.textContent = 'クロは　かえってきた。　ゆきは　もう　いない。　つぎは　' + name + '。'; });
            document.getElementById('siteName').textContent = 'DarkWebDark';
            document.getElementById('counter').textContent = '000203';
            document.getElementById('counterNote').textContent = name + '　の　へや';
            DWD.sfx.stinger();
            document.body.classList.add('dwd-shake');
            setTimeout(function () {
              document.body.classList.remove('dwd-shake');
              DWD.scare({ type: 'face', dur: 1900 }).then(function () {
                return DWD.scare({ type: 'text', text: 'にがさない', dur: 1200 });
              }).then(function () {
                DWD.set('cleared', true);
                DWD.go('end.html', 600);
              });
            }, 1600);
          }
        }, 220);
      }, 4200);
    }
    // どこかを押すか、しばらく待つと始まる
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a');
      if (a) e.preventDefault();
      finale();
    }, true);
    setTimeout(finale, 9000);
    return;
  }

  /* -------- 通常（だんだん不気味に） -------- */
  render(POSTS);
  if (DWD.get('rtaUnlocked') && !DWD.rtaRunning()) rtaCard();
  if (read >= 3) document.body.classList.add('stage-3');
  if (read >= 4) document.body.classList.add('stage-4');
  if (read >= 5) document.body.classList.add('stage-5');

  var counter = document.getElementById('counter');
  if (read >= 2) counter.textContent = '00' + (1203 + read * 37);
  if (read >= 3) {
    counter.textContent = '000203';
    document.getElementById('counterNote').textContent = 'いつも　見てるよ♪';
  }
  if (read >= 4) {
    counter.textContent = '000001';
    document.getElementById('counterNote').textContent = 'あなたが　はじめての　ひと';
    document.getElementById('avatar').classList.add('creepy');
    document.getElementById('profText').innerHTML = '社会人2年目。最近ひとり暮らしをはじめました。<s>黒猫のクロと暮らしてます</s> <span class="redtext">となりの人と　くらしてます</span>';
    var li = document.createElement('li');
    li.innerHTML = '<a href="dwd/index.html" class="faint" style="color:#ece4d8">となりのへや</a>';
    document.getElementById('links').appendChild(li);
  }
  if (read >= 4) {
    // 時々タイトルが一瞬化ける
    setInterval(function () {
      if (Math.random() < 0.5) DWD.glitchText(document.getElementById('siteName'), 300, 0.6);
    }, 6000);
  }
  // 無題の記事は、前の記事を読むまではただの空白
  if (read < 4) {
    var first = main.querySelector('.post-excerpt');
    if (first) first.textContent = '　';
  } else {
    var f2 = main.querySelector('.post-excerpt');
    if (f2) f2.innerHTML = '<span class="redtext">だれか　みてますか</span>';
  }
})();
</script>
</body>
</html>
